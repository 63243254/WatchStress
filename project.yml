name: WatchStress
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Configuration/Common.xcconfig
  Release: Configuration/Common.xcconfig
packages:
  StressCore:
    path: Core
targets:
  WatchStressPhone:
    type: application
    platform: iOS
    sources:
      - Phone
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: 压力观察
        NSHealthShareUsageDescription: 读取心率变异性和心率，在你的设备上显示身体压力的估计与变化。
        StressAppGroup: $(APP_GROUP_IDENTIFIER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Generated/Phone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - package: StressCore
      - target: WatchStressWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  WatchStressWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_PREFIX).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: 压力观察
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_PREFIX)
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: 读取手表的心率变异性和心率，显示最新样本和相对个人基线的压力估计。
        StressAppGroup: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - package: StressCore
      - target: WatchStressComplication
        embed: true
        link: false
  WatchStressComplication:
    type: app-extension
    platform: watchOS
    sources:
      - Complication
      - path: Shared/SnapshotCache.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_PREFIX).watchkitapp.complication
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Complication-Info.plist
      properties:
        CFBundleDisplayName: 压力观察
        StressAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Complication.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - package: StressCore
schemes:
  WatchStressPhone:
    build:
      targets:
        WatchStressPhone: all
    run:
      config: Debug
    archive:
      config: Release
  WatchStressWatch:
    build:
      targets:
        WatchStressWatch: all
    run:
      config: Debug

